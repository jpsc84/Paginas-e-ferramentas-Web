<style>
:root{--bg:#FBF8F2;--surface:#FFFFFF;--text:#122047;--muted:#5A6378;--line:#CAD5EA;--cobalt:#1D3F8F;--gold:#9A6B1F}
@media (prefers-color-scheme: dark){:root{--bg:#0E1630;--surface:#141E3D;--text:#E9EEF9;--muted:#A6B1CC;--line:#2A3866;--cobalt:#8FAEF2;--gold:#E2B868}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Instrument Sans",system-ui,sans-serif;display:grid;place-items:center;padding:32px 16px}
main{width:100%;max-width:520px}

p{color:var(--muted);margin:0 0 24px}
a{display:block;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:12px}
a:hover{border-color:var(--cobalt)}
a b{display:block;font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.3rem;color:var(--cobalt)}
a em{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.45rem;color:var(--gold)}
a small{color:var(--muted)}
</style>
</head>
